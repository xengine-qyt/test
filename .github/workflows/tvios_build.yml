name: tvos build workflows

on:
  push:

permissions:
  contents: read
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7

      - name: brew install
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
      - name: vcpkg dependency repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg        
          ref: 2026.10.16
             
      - name: vcpkg install
        run: |
            brew install pkg-config autoconf nasm

            cp XEngine_SourceCode/arm64-tvios-xengine.cmake vcpkg/triplets/arm64-tvios-xengine.cmake
            cp -rf ./vcpkg $HOME
            
            cd $HOME/vcpkg
            ./bootstrap-vcpkg.sh
            ./vcpkg install libiconv:arm64-tvios-xengine 'curl[openssl,http2]:arm64-tvios-xengine' 'sqlite3:arm64-tvios-xengine' 'zlib:arm64-tvios-xengine' 'minizip:arm64-tvios-xengine' 'nghttp2:arm64-tvios-xengine' 'ffmpeg:arm64-tvios-xengine' --clean-after-build