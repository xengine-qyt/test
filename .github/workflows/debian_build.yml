name: debian build workflows

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:${{ matrix.name }}
      options: --platform ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            artifact: x86-64
            name: bookworm
            version: 12
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            artifact: x86-64
            name: trixie
            version: 13
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: Arm64
            name: bookworm
            version: 12
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: Arm64
            name: trixie
            version: 13

    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7

      - name: Set TERM variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: test
        run: |
            apt update -y

            apt search libmariadb
            apt install pkg-config libmariadb-dev -y
            ls -al /usr/include/mariadb/ 
            pkg-config --cflags libmariadb
            pkg-config --libs libmariadb