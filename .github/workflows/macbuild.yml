name: ios build workflows

on:
  push:

permissions:
  contents: read
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
          - os: macos-26-intel
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7

      - name: vcpkg dependency repository
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg        
          ref: 2026.06.24
             
      - name: install
        run: |
            brew install pkg-config
            brew install mysql-client@9.7